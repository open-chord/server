spring.application.name=open-chord-server
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/openchord}
spring.datasource.username=${DATABASE_USERNAME:openchord}
spring.datasource.password=${DATABASE_PASSWORD:openchord}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:20GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:20GB}
spring.mvc.async.request-timeout=${ASYNC_REQUEST_TIMEOUT:1h}
spring.graphql.graphiql.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
openchord.media-root=${MEDIA_ROOT:./media}
openchord.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
openchord.lyrics-aligner-url=${LYRICS_ALIGNER_URL:}
