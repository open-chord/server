services:
  api:
    environment:
      LYRICS_ALIGNER_URL: http://lyrics-aligner:8080
    depends_on:
      lyrics-aligner:
        condition: service_started

  lyrics-aligner:
    image: ghcr.io/ggml-org/whisper.cpp:main
    command:
      - whisper-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --convert
      - --language
      - auto
      - --model
      - /models/ggml-small.bin
    volumes:
      - ./models/whisper:/models:ro
    restart: unless-stopped
