services:
  api:
    environment:
      LYRICS_ALIGNER_URL: http://lyrics-aligner:8080
    depends_on:
      lyrics-aligner:
        condition: service_started

  lyrics-aligner:
    image: ${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main}
    platform: ${WHISPER_PLATFORM:-linux/amd64}
    command:
      - >-
        whisper-server --host 0.0.0.0 --port 8080 --convert
        --language auto --model /models/ggml-small.bin
    volumes:
      - ./models/whisper:/models:ro
    restart: unless-stopped
